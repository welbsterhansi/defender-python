[project]
name = "defender-pipeline"
version = "0.1.0"
description = "Python API-first pipeline: ACR vulnerability scan (Azure Resource Graph + Defender for Cloud) + OpenShift cross-reference + CVE-level expansion."
requires-python = ">=3.11"

dependencies = [
    "azure-identity>=1.15,<2.0",             # DefaultAzureCredential chain
    "azure-mgmt-resourcegraph>=8.0,<9.0",    # ARG queries (api 2022-10-01)
    "azure-containerregistry>=1.2,<2.0",     # ACR tags/manifests
    "kubernetes>=29.0,<32.0",                # OpenShift correlation
    "tenacity>=8.2,<10.0",                   # batch-split retry
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "ruff>=0.6",
]

[project.scripts]
defender-pipeline = "defender_pipeline.cli:main"

[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["defender_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
allowed-confusables = ["–", "—", "−", "≥", "•", "…", "→", "×"]

[tool.pyright]
include = ["defender_pipeline", "tests"]
extraPaths = ["."]
pythonVersion = "3.11"
reportMissingImports = "error"
reportUnusedImport = "warning"
